name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize refactor modules
        run: python -m app._ensure_refactor_modules

      - name: Headless smoke (materialize + compile)
        run: python scripts/smoke_launch.py

      - name: Compile critical UI modules
        run: |
          python -m py_compile \
            app/main.py \
            app/_ensure_refactor_modules.py \
            app/ui/app_window.py \
            app/ui/page_router.py \
            app/ui/components/chat_thinking.py \
            app/ui/components/chat_rail.py \
            app/ui/components/chat_send.py \
            app/ui/components/chat_dialogs.py \
            app/ui/components/chat_render.py \
            app/ui/components/chat_misc.py \
            app/ui/pages/chat_page.py \
            app/ui/pages/settings_page.py

      - name: Compile large pages (syntax only)
        run: |
          python -m py_compile \
            app/ui/pages/org_page.py \
            app/ui/pages/org_page_ai.py \
            app/ui/pages/team_page.py \
            app/ui/pages/team_dialogs.py \
            app/ui/pages/org_chart_view.py \
            app/ui/pages/org_chart_widgets.py \
            app/ui/pages/mgmt_pages.py \
            app/ui/pages/models_page.py \
            app/ui/pages/models_advanced.py \
            app/ui/pages/chats_page.py

      - name: Verify payload integrity (decompress)
        run: |
          python - <<'PY'
          import base64, re, zlib, sys
          from pathlib import Path
          root = Path(".")
          payload = root / "scripts" / "refactor_payload"
          if not payload.is_dir():
              print("No payload dir — skip")
              sys.exit(0)
          groups = {}
          for p in sorted(payload.glob("*.b64")):
              m = re.match(r"(.+)\.z\d+\.b64$", p.name)
              if not m:
                  continue
              groups.setdefault(m.group(1), []).append(p)
          failed = []
          for prefix, parts in sorted(groups.items()):
              padded = [x for x in parts if re.search(r"\.z\d{2}\.b64$", x.name)]
              use = padded if padded else parts
              try:
                  b64 = "".join(re.sub(r"\s+", "", x.read_text(encoding="ascii")) for x in use)
                  raw = zlib.decompress(base64.b64decode(b64))
                  print(f"OK {prefix}: {len(use)} chunks → {len(raw)} bytes")
              except Exception as e:
                  failed.append(f"{prefix}: {e}")
                  print(f"FAIL {prefix}: {e}")
          if failed:
              print("Payload integrity failures:")
              for f in failed:
                  print(" ", f)
              sys.exit(1)
          print(f"All {len(groups)} payload groups OK")
          PY

      - name: Run unit smoke tests
        run: python -m unittest tests.test_refactor_smoke -v
